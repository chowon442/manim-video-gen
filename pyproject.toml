[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-video-gen"
version = "0.1.0"
description = "Math explanation video pipeline: LLM + Manim + TTS + FFmpeg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.19.0",
    "elevenlabs>=1.50.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
